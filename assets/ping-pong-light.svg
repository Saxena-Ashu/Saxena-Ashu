<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ping pong — auto rally">
  <rect x="10" y="10" width="620" height="280" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="30" y="44" font-size="14" font-family="monospace" font-weight="bold" fill="#0369A1">PING PONG</text>
  <text x="610" y="44" font-size="10" font-family="monospace" fill="#475569" text-anchor="end">auto rally</text>
  <rect x="30" y="60" width="580" height="200" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
  <line x1="320" y1="60" x2="320" y2="260" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="44" y="84" font-size="11" font-family="monospace" fill="#475569">Player 1</text>
  <text x="596" y="84" font-size="11" font-family="monospace" fill="#475569" text-anchor="end">CPU</text>
  <text x="320" y="96" font-size="13" font-family="monospace" font-weight="bold" fill="#0F172A" text-anchor="middle">0 — 0</text>
  <rect x="50" y="120" width="10" height="56" rx="5" fill="#0369A1">
    <animate attributeName="y" values="120;170;120" dur="4.5s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
  </rect>
  <rect x="580" y="120" width="10" height="56" rx="5" fill="#7C3AED">
    <animate attributeName="y" values="170;120;170" dur="4.5s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
  </rect>
  <g>
    <animateTransform attributeName="transform" type="translate" values="56 148;564 148;56 148" dur="4.5s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="9" fill="#0891B2" opacity="0.22"/>
    <circle cx="0" cy="0" r="5.5" fill="#0891B2"/>
  </g>
</svg>
