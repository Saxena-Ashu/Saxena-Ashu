<svg width="560" viewBox="0 0 540 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Platform scale metrics">
  <defs>
    <linearGradient id="pmBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="528" height="184" rx="14" fill="#111827" stroke="#1E3A5F"/>
  <text x="26" y="36" font-size="14" font-family="monospace" font-weight="bold" fill="#00D4FF">Platform Scale</text>
  <text x="26" y="70" font-size="12" font-family="monospace" fill="#E6F1FF">Concurrent users</text>
  <rect x="210" y="60" width="250" height="10" rx="5" fill="#1E3A5F"/>
  <rect x="210" y="60" width="0" height="10" rx="5" fill="url(#pmBar)">
    <animate attributeName="width" from="0" to="250" dur="1.2s" fill="freeze" begin="0.2s"/>
  </rect>
  <rect x="206" y="60" width="40" height="10" rx="5" fill="#E6F1FF" opacity="0.22">
    <animate attributeName="x" values="210;460" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="468" y="70" font-size="12" font-family="monospace" font-weight="bold" fill="#00D4FF">800+</text>
  <text x="26" y="100" font-size="12" font-family="monospace" fill="#E6F1FF">Individual registrations</text>
  <rect x="210" y="90" width="250" height="10" rx="5" fill="#1E3A5F"/>
  <rect x="210" y="90" width="0" height="10" rx="5" fill="url(#pmBar)">
    <animate attributeName="width" from="0" to="156" dur="1.2s" fill="freeze" begin="0.5s"/>
  </rect>
  <rect x="206" y="90" width="40" height="10" rx="5" fill="#E6F1FF" opacity="0.22">
    <animate attributeName="x" values="210;460" dur="2.6s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <text x="468" y="100" font-size="12" font-family="monospace" font-weight="bold" fill="#22D3EE">500+</text>
  <text x="26" y="130" font-size="12" font-family="monospace" fill="#E6F1FF">Team registrations</text>
  <rect x="210" y="120" width="250" height="10" rx="5" fill="#1E3A5F"/>
  <rect x="210" y="120" width="0" height="10" rx="5" fill="url(#pmBar)">
    <animate attributeName="width" from="0" to="94" dur="1.2s" fill="freeze" begin="0.8s"/>
  </rect>
  <rect x="206" y="120" width="40" height="10" rx="5" fill="#E6F1FF" opacity="0.22">
    <animate attributeName="x" values="210;460" dur="2.6s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <text x="468" y="130" font-size="12" font-family="monospace" font-weight="bold" fill="#8B5CF6">300+</text>
  <text x="26" y="160" font-size="12" font-family="monospace" fill="#E6F1FF">Data integrity</text>
  <rect x="210" y="150" width="250" height="10" rx="5" fill="#1E3A5F"/>
  <rect x="210" y="150" width="0" height="10" rx="5" fill="url(#pmBar)">
    <animate attributeName="width" from="0" to="250" dur="1.2s" fill="freeze" begin="1.1s"/>
  </rect>
  <rect x="206" y="150" width="40" height="10" rx="5" fill="#E6F1FF" opacity="0.22">
    <animate attributeName="x" values="210;460" dur="2.6s" repeatCount="indefinite" begin="0.9s"/>
  </rect>
  <text x="468" y="160" font-size="12" font-family="monospace" font-weight="bold" fill="#00D4FF">100%</text>
</svg>
