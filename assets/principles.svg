<svg width="520" viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering principles">
  <defs>
    <linearGradient id="prBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="512" height="232" rx="14" fill="#111827" stroke="#1E3A5F"/>
  <text x="24" y="30" font-size="13" font-family="monospace" font-weight="bold" fill="#00D4FF">ENGINEERING PRINCIPLES</text>

  <!-- principle 1 -->
  <rect x="24" y="48" width="26" height="20" rx="5" fill="#00D4FF" opacity="0.15"/>
  <text x="37" y="63" font-size="11" font-family="monospace" font-weight="bold" fill="#00D4FF" text-anchor="middle">01</text>
  <text x="62" y="63" font-size="13" font-family="monospace" font-weight="bold" fill="#E6F1FF">Scale-first design</text>
  <text x="62" y="80" font-size="11" font-family="monospace" fill="#8BA3BF">systems built for scale from day one</text>
  <rect x="330" y="52" width="150" height="9" rx="4.5" fill="#1E3A5F"/>
  <rect x="330" y="52" width="0" height="9" rx="4.5" fill="url(#prBar)">
    <animate attributeName="width" from="0" to="142" dur="1.3s" fill="freeze" begin="0.2s"/>
  </rect>
  <rect x="328" y="52" width="26" height="9" rx="4.5" fill="#E6F1FF" opacity="0.2">
    <animate attributeName="x" values="330;480" dur="2.4s" repeatCount="indefinite" begin="0.2s"/>
  </rect>

  <!-- principle 2 -->
  <rect x="24" y="96" width="26" height="20" rx="5" fill="#22D3EE" opacity="0.15"/>
  <text x="37" y="111" font-size="11" font-family="monospace" font-weight="bold" fill="#22D3EE" text-anchor="middle">02</text>
  <text x="62" y="111" font-size="13" font-family="monospace" font-weight="bold" fill="#E6F1FF">Measure everything</text>
  <text x="62" y="128" font-size="11" font-family="monospace" fill="#8BA3BF">95+ Lighthouse · 99.9% uptime · measurable wins</text>
  <rect x="330" y="100" width="150" height="9" rx="4.5" fill="#1E3A5F"/>
  <rect x="330" y="100" width="0" height="9" rx="4.5" fill="url(#prBar)">
    <animate attributeName="width" from="0" to="138" dur="1.3s" fill="freeze" begin="0.5s"/>
  </rect>
  <rect x="328" y="100" width="26" height="9" rx="4.5" fill="#E6F1FF" opacity="0.2">
    <animate attributeName="x" values="330;480" dur="2.4s" repeatCount="indefinite" begin="0.5s"/>
  </rect>

  <!-- principle 3 -->
  <rect x="24" y="144" width="26" height="20" rx="5" fill="#8B5CF6" opacity="0.15"/>
  <text x="37" y="159" font-size="11" font-family="monospace" font-weight="bold" fill="#8B5CF6" text-anchor="middle">03</text>
  <text x="62" y="159" font-size="13" font-family="monospace" font-weight="bold" fill="#E6F1FF">Ship iteratively</text>
  <text x="62" y="176" font-size="11" font-family="monospace" fill="#8BA3BF">real-time validation — 60% fewer registration failures</text>
  <rect x="330" y="148" width="150" height="9" rx="4.5" fill="#1E3A5F"/>
  <rect x="330" y="148" width="0" height="9" rx="4.5" fill="url(#prBar)">
    <animate attributeName="width" from="0" to="90" dur="1.3s" fill="freeze" begin="0.8s"/>
  </rect>
  <rect x="328" y="148" width="26" height="9" rx="4.5" fill="#E6F1FF" opacity="0.2">
    <animate attributeName="x" values="330;480" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </rect>

  <!-- principle 4 -->
  <rect x="24" y="192" width="26" height="20" rx="5" fill="#0077FF" opacity="0.15"/>
  <text x="37" y="207" font-size="11" font-family="monospace" font-weight="bold" fill="#0077FF" text-anchor="middle">04</text>
  <text x="62" y="207" font-size="13" font-family="monospace" font-weight="bold" fill="#E6F1FF">Lead by building</text>
  <text x="62" y="224" font-size="11" font-family="monospace" fill="#8BA3BF">cross-functional teams · mobile-first · engagement +30%</text>
  <rect x="330" y="196" width="150" height="9" rx="4.5" fill="#1E3A5F"/>
  <rect x="330" y="196" width="0" height="9" rx="4.5" fill="url(#prBar)">
    <animate attributeName="width" from="0" to="146" dur="1.3s" fill="freeze" begin="1.1s"/>
  </rect>
  <rect x="328" y="196" width="26" height="9" rx="4.5" fill="#E6F1FF" opacity="0.2">
    <animate attributeName="x" values="330;480" dur="2.4s" repeatCount="indefinite" begin="1.1s"/>
  </rect>
</svg>
