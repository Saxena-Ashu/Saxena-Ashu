<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ashu Saxena — header">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="#0A0F1C"/>

  <!-- subtle cyber grid -->
  <g stroke="#1E3A5F" stroke-opacity="0.35">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="300" y1="0" x2="300" y2="120"/>
    <line x1="600" y1="0" x2="600" y2="120"/>
    <line x1="900" y1="0" x2="900" y2="120"/>
  </g>

  <!-- twinkling grid nodes -->
  <g>
    <circle cx="300" cy="40" r="2.5" fill="#00D4FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;3;1.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="80" r="2.5" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="40" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="120" r="2" fill="#0077FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="2" fill="#00D4FF">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="80" r="2" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="40" r="2" fill="#22D3EE">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- upper glow band -->
  <path d="M0 60 C 200 20, 400 90, 600 55 S 1000 20, 1200 65 L 1200 0 L 0 0 Z" fill="#0077FF" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0;40 0;0 0" dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- back wave -->
  <g opacity="0.55">
    <path d="M-80 130 C 80 95, 220 165, 380 132 S 620 100, 780 132 S 1020 168, 1200 132 L 1200 200 L -80 200 Z" fill="url(#waveGrad2)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 0;0 0;70 0;0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- main wave -->
  <g>
    <path d="M-60 150 C 100 115, 240 185, 400 152 S 640 118, 800 152 S 1040 188, 1220 152 L 1220 200 L -60 200 Z" fill="url(#waveGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0;-70 0;0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- light sweep across the wave -->
  <g transform="skewX(-18)">
    <rect x="-300" y="110" width="150" height="90" fill="#E6F1FF" opacity="0.10">
      <animateTransform attributeName="transform" type="translate" values="0 0;1500 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
