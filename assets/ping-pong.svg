<svg width="640" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ping pong — auto rally demo">
  <rect x="10" y="10" width="620" height="280" rx="14" fill="#111827" stroke="#1E3A5F"/>
