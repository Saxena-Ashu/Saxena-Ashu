<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping Pong — Ashu Saxena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <h1 class="title">PING&nbsp;PONG</h1>

    <div class="scoreboard" aria-label="Scoreboard">
      <div class="side">
        <span class="side-name">YOU</span>
        <span class="score" id="score-you">0</span>
      </div>
      <span class="vs">VS</span>
      <div class="side">
        <span class="side-name">CPU</span>
        <span class="score" id="score-cpu">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="court" width="900" height="500"></canvas>
    </div>

    <div class="controls">
      <button id="btn-start" class="btn btn-primary">START GAME</button>
      <button id="btn-pause" class="btn" disabled>PAUSE</button>
      <button id="btn-restart" class="btn">RESTART</button>
    </div>

    <p class="hint">W / S or ↑ / ↓ to move your paddle · first to 7 points · first to 11 in Player&nbsp;vs&nbsp;Player mode</p>
    <p class="mode">Player vs Computer</p>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-sub"></p>
        <button id="btn-again" class="btn btn-primary">PLAY AGAIN</button>
      </div>
    </div>

    <footer class="foot">
      <a href="https://github.com/Saxena-Ashu/Saxena-Ashu">github.com/Saxena-Ashu</a>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
